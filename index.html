<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SPINTOOB</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="form-view">
  <h1>SPINTOOB</h1>
  <p><b>spins a youtube video.</b></p>
  <hr>

  <svg id="hero" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="480" height="270">
    <defs>
      <marker id="bigarrow" viewBox="0 0 10 10" refX="5" refY="5"
        markerUnits="strokeWidth" markerWidth="2.4" markerHeight="2.4" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 L 2 5 Z" fill="#000"/>
      </marker>
    </defs>

    <!-- radial concentric motion blur: stacked rotated copies. -->
    <!-- pixels far from center traverse longer arcs per degree, so edges smear into circles. -->
    <g>
      <g transform="rotate(-24 640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.22"/></g>
      <g transform="rotate(-20 640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.22"/></g>
      <g transform="rotate(-16 640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.24"/></g>
      <g transform="rotate(-12 640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.26"/></g>
      <g transform="rotate(-8  640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.28"/></g>
      <g transform="rotate(-4  640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.30"/></g>
      <image href="/hq720.jpg" width="1280" height="720" opacity="0.35"/>
      <g transform="rotate(4   640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.30"/></g>
      <g transform="rotate(8   640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.28"/></g>
      <g transform="rotate(12  640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.26"/></g>
      <g transform="rotate(16  640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.24"/></g>
      <g transform="rotate(20  640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.22"/></g>
      <g transform="rotate(24  640 360)"><image href="/hq720.jpg" width="1280" height="720" opacity="0.22"/></g>
    </g>

    <!-- huge fat clockwise arrows overlaid on top of the photo. -->
    <g fill="none" stroke="#000" stroke-linecap="butt">
      <!-- top arrow: arc sweeping clockwise from upper-left to upper-right -->
      <path d="M 380 145 A 320 320 0 0 1 900 145" stroke-width="56" marker-end="url(#bigarrow)"/>
      <!-- bottom arrow: arc sweeping clockwise from lower-right to lower-left -->
      <path d="M 900 575 A 320 320 0 0 1 380 575" stroke-width="56" marker-end="url(#bigarrow)"/>
    </g>
  </svg>

  <hr>

  <form id="spin-form">
    <p>
      <label for="url">YOUTUBE VIDEO URL:</label>
      [<a href="#" id="example-link">example video</a>]<br>
      <input type="text" id="url" name="url" size="60" placeholder="https://www.youtube.com/watch?v=..." required>
    </p>
    <p>
      <label for="speed">SPIN SPEED (RPM, can be negative):</label><br>
      <input type="number" id="speed" name="speed" value="30" step="any" required>
    </p>
    <p>
      <input type="submit" value="OK">
    </p>
  </form>
</div>

<div id="spin-view" hidden>
  <div id="spinner">
    <iframe id="player"
      width="800" height="450"
      src=""
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>
  <p id="back-link-wrap"><a href="#" id="back-link">&laquo; back</a></p>
</div>

<script type="module" src="/main.js"></script>
</body>
</html>
